[workspace]
resolver = "2"
members = [
    "crates/everest-proto",
    "crates/everest-hid",
    "crates/everest-core",
    "crates/kebnekaise-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dangerswede/kebnekaise"
rust-version = "1.80"

[workspace.dependencies]
everest-proto = { path = "crates/everest-proto" }
everest-hid = { path = "crates/everest-hid" }
everest-core = { path = "crates/everest-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
